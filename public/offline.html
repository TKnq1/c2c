<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're offline · C2C</title>
<style>
  :root { --ink: #070707; --paper: #ffffff; --graphite: #797979; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ffffff; --paper: #1e1e1e; --graphite: #a2a2a9; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
  p { color: var(--graphite); margin: 0; max-width: 320px; line-height: 1.5; }
  button {
    margin-top: 8px;
    border-radius: 4px;
    border: none;
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>You&rsquo;re offline</h1>
  <p>C2C needs a connection to load your feed, messages, and payments. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Retry</button>
</body>
</html>
