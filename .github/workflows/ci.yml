name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Only what the build needs to compile; nothing here is a real credential.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-only-secret-0123456789abcdef012345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PageProps, LayoutProps and RouteContext are generated; a fresh checkout doesn't have them yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # The remaining advisories (prisma CLI -> deepmerge-ts / mysql2, firebase-admin -> gaxios/uuid) are
      # tooling or unused code paths and npm's only offered fix is a Prisma downgrade. A critical one fails CI.
      - run: npm audit --omit=dev --audit-level=critical

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
