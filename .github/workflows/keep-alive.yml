name: Keep-alive ping

# Vercel's Hobby plan only allows daily cron jobs, which is too infrequent
# to stop Neon's compute from autosuspending after 5 minutes idle (the
# cause of the multi-second "cold start" on the first request after a
# quiet stretch) — see vercel.json. GitHub Actions isn't subject to that
# limit, so the keep-alive ping lives here instead.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS https://www.companytocreator.com/api/health
